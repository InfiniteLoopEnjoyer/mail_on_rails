name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  # Advisories land between pushes; a daily re-scan catches new CVEs in the
  # bundle, the JS deps, and the container image even when the repo is
  # quiet. Lint and tests are skipped on the scheduled runs - only the
  # scan_* jobs repeat.
  schedule:
    - cron: "17 5 * * *"

# The mail_on_rails_imap path gem points at a sibling repo that doesn't
# exist on CI runners; skipping its group keeps bundle install happy, and
# the store-contract tests skip themselves.
env:
  BUNDLE_WITHOUT: daemons

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # bin/importmap boots the full app (config/application + Bundler.require),
      # and ruby-vips raises at load time without the native library - same
      # reason the test jobs install it.
      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  scan_image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build -t mail_on_rails:ci .

      # bundler-audit sees the gems; this sees the OS layer (ruby:slim's
      # Debian packages). ignore-unfixed skips CVEs Debian has no patch
      # for yet - failing on those would just leave CI permanently red.
      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mail_on_rails:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_HOST: 127.0.0.1
          # Internal API auth for controller tests - CI has no RAILS_MASTER_KEY,
          # so the credentials-stored password is unavailable (see the env
          # fallback in MailOnRails::InternalController).
          SMTP_INTERNAL_API_PASSWORD: test-internal-api-password
          # Same story for the Action Mailbox relay ingress: without this,
          # authenticate_by_password raises instead of returning 401.
          RAILS_INBOUND_EMAIL_PASSWORD: test-inbound-email-password
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: bin/rails db:test:prepare test

  system-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install libvips
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips

      - name: Run System Tests
        env:
          RAILS_ENV: test
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 5432
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: |
          bin/rails db:test:prepare

          if find test/system -name "*_test.rb" -type f 2>/dev/null | grep -q .; then
            bin/rails test:system
          else
            echo "No system tests found. Skipping system-test job."
          fi

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
