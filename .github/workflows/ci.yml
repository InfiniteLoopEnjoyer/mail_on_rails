name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  # Brakeman lives in security.yml and RuboCop in lint.yml - separate
  # workflows so each gets its own README status badge. The protocol
  # servers' own suites (wire, CVE, conformance, fuzz) run in their gems'
  # CI: mail_on_rails_smtp and mail_on_rails_imap.

  rails-free-suites:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Settings suite
        run: bundle exec rake test:settings

      - name: Netserv suite
        run: bundle exec rake test:netserv

      - name: Sender-auth suite
        run: bundle exec rake test:sender_auth

      - name: Primitives suite
        run: bundle exec rake test:lib

      - name: DNSSEC suite
        run: bundle exec rake test:dnssec

  # The Active Record side (migration, models, store plumbing) against
  # every supported adapter. The sqlite leg runs with no DATABASE_URL -
  # that is also the harness default, so it doubles as the "works with
  # zero setup" check.
  db-suites:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - adapter: sqlite
          - adapter: postgres
            database_url: postgres://postgres:postgres@127.0.0.1:5432/mail_on_rails_test
          - adapter: mysql
            database_url: trilogy://root:root@127.0.0.1:3306/mail_on_rails_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mail_on_rails_test
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mail_on_rails_test
        ports: [ "3306:3306" ]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: DB suite (${{ matrix.adapter }})
        run: bundle exec rake test:db
        env:
          DATABASE_URL: ${{ matrix.database_url }}
