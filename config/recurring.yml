#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

development:
  deliver_smtp_outbound:
    class: DeliverSmtpOutboundJob
    schedule: "*/15 * * * * *" # every 15 seconds

production:
  deliver_smtp_outbound:
    class: DeliverSmtpOutboundJob
    schedule: "*/15 * * * * *" # every 15 seconds

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Scan-then-ingest dmarc@ mail that arrived while clamav was disabled
  # (reports are never parsed without a clean scan).
  scan_pending_dmarc_reports:
    class: ScanPendingDmarcReportsJob
    schedule: every hour at minute 41

  # Auth throttle counters are only read for live windows and blocks; this
  # keeps the table from growing without bound under a sustained attack.
  prune_auth_throttles:
    command: "AuthThrottle.prune!"
    schedule: every hour at minute 23

  # The attempt log's write rate is set by whoever is attacking, so its
  # retention has to be enforced rather than assumed.
  prune_auth_attempts:
    command: "AuthAttempt.prune!"
    schedule: every day at 4:17am
